name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Linux only. macOS is covered by running the engine tests locally before any engine PR: the
# golden battle test pins the same digest on both platforms.
# The runner image is pinned: a new Ubuntu brings a new gcc, whose new warnings would turn the
# build red (warnings are errors) without any change in this repository.
jobs:
  engine:
    name: Engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build engine/build -j

      - name: Test
        run: ctest --test-dir engine/build --output-on-failure

  python:
    name: Python
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check
          ruff format --check

      - name: Type check (package)
        run: mypy src

      # The two steps below wake up with the first test file.
      - name: Type check (tests)
        if: hashFiles('ai/tests/**/*.py') != ''
        run: mypy tests

      - name: Test
        if: hashFiles('ai/tests/**/*.py') != ''
        run: pytest
