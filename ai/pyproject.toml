[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3"]
build-backend = "scikit_build_core.build"

[project]
name = "trainerlab"
version = "0.1.0"
description = "AI agents for a Pokemon-style battle engine"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pybind11-stubgen>=2.5"]

[tool.scikit-build]
# The C++ side lives in bindings/, and pulls ../../engine in as a subproject.
cmake.source-dir = "bindings"
wheel.packages = ["src/trainerlab"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Used by `pytest --cov` (CI): every line and every branch of the package must run under a test.
# A plain `pytest` stays free of it, so running a single test file locally does not fail.
[tool.coverage.run]
source = ["trainerlab"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "bindings/build", "src/trainerlab/_engine.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# Generated by pybind11-stubgen: its types are used, its own style is not checked.
[[tool.mypy.overrides]]
module = "trainerlab._engine"
ignore_errors = true
